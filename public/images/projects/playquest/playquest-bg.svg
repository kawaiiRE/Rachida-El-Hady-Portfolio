      </text>
      <g transform="translate(34 86)">
        <rect width="58" height="58" rx="9" fill="#158264" />
        <rect x="70" width="58" height="58" rx="9" fill="#f2b134" />
        <rect x="140" width="58" height="58" rx="9" fill="#546176" />
        <rect x="210" width="58" height="58" rx="9" fill="#158264" />
        <rect x="280" width="58" height="58" rx="9" fill="#546176" />
        <text x="19" y="38" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          Q
        </text>
        <text x="90" y="38" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          U
        </text>
        <text x="160" y="38" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          E
        </text>
        <text x="230" y="38" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          S
        </text>
        <text x="301" y="38" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          T
        </text>
      </g>
      <g transform="translate(34 168)">
        <rect width="174" height="42" rx="8" fill="#1f2a3a" />
        <rect x="190" width="174" height="42" rx="8" fill="#1f2a3a" />
        <text x="24" y="28" fill="#e7edf6" font-family="Arial, sans-serif" font-size="18" font-weight="700">
          Hangman
        </text>
        <text x="214" y="28" fill="#e7edf6" font-family="Arial, sans-serif" font-size="18" font-weight="700">
          Anagram
        </text>
      </g>
    </g>

    <g transform="translate(752 148)">
      <rect width="330" height="170" rx="18" fill="#fff6df" />
      <text x="30" y="46" fill="#c88918" font-family="Arial, sans-serif" font-size="24" font-weight="800">
        Math Wordle
      </text>
      <text x="30" y="92" fill="#17222f" font-family="Arial, sans-serif" font-size="36" font-weight="800">
        4 + 5 = 9
      </text>
      <text x="30" y="130" fill="#536176" font-family="Arial, sans-serif" font-size="18">
        Equation feedback
      </text>
    </g>

    <g transform="translate(1058 510)">
      <rect width="340" height="190" rx="18" fill="#eefaf4" />
      <text x="30" y="48" fill="#158264" font-family="Arial, sans-serif" font-size="24" font-weight="800">
        Sequence Solver
      </text>
      <text x="30" y="96" fill="#17222f" font-family="Arial, sans-serif" font-size="34" font-weight="800">
        3, 6, 12, 24, ?
      </text>
      <text x="30" y="134" fill="#536176" font-family="Arial, sans-serif" font-size="18">
        Generated pattern rounds
      </text>
    </g>
  </g>
