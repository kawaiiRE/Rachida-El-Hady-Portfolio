<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">PlayQuest puzzle arcade background</title>
  <desc id="desc">
    A dark PlayQuest game background with code tiles, word clues, equation cards, and the Q-shaped play mark.
  </desc>
  <defs>
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0" stop-color="#071124" />
      <stop offset="0.45" stop-color="#162235" />
      <stop offset="1" stop-color="#090d1a" />
    </linearGradient>
    <linearGradient id="playQuestGradient" x1="538" y1="210" x2="1260" y2="824">
      <stop offset="0" stop-color="#f2b134" />
      <stop offset="0.42" stop-color="#ef4f63" />
      <stop offset="0.72" stop-color="#7c55d8" />
      <stop offset="1" stop-color="#176bff" />
    </linearGradient>
    <pattern id="grid" width="68" height="68" patternUnits="userSpaceOnUse">
      <path d="M 68 0 H 0 V 68" fill="none" stroke="#ffffff" stroke-opacity="0.055" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020817" flood-opacity="0.38" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#backgroundGradient)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <g opacity="0.26">
    <path
      fill="url(#playQuestGradient)"
      d="M 950 123 C 918 124 887 142 866 162 C 840 186 825 216 824 242 L 822 660 C 822 714 851 761 893 793 C 930 820 978 834 1027 831 C 1058 829 1090 819 1114 804 L 1222 739 C 1230 734 1231 725 1225 719 L 1149 647 C 1141 640 1133 640 1125 645 L 1049 698 C 1032 707 1012 693 1008 675 L 1006 350 C 1006 335 1017 326 1024 324 C 1039 317 1058 320 1070 327 L 1308 474 C 1337 492 1348 526 1334 548 C 1329 562 1320 576 1309 588 L 1376 655 C 1390 652 1404 644 1417 631 C 1459 589 1480 531 1477 460 C 1473 406 1451 355 1394 318 L 1084 132 C 1048 112 997 120 950 123 Z M 1196 626 C 1180 640 1175 659 1182 676 L 1358 853 C 1365 859 1376 858 1385 851 L 1445 800 C 1454 792 1448 780 1428 767 L 1274 610 C 1259 602 1230 603 1219 606 C 1207 610 1200 622 1196 626 Z"
    />
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(118 120)">
      <rect width="390" height="238" rx="18" fill="#f7fbff" />
      <rect x="24" y="24" width="342" height="48" rx="10" fill="#eef5ff" />
      <text x="44" y="56" fill="#2463eb" font-family="Arial, sans-serif" font-size="22" font-weight="800">
        Numbers
      </text>
      <g transform="translate(44 108)">
        <rect width="54" height="54" rx="8" fill="#2463eb" />
        <rect x="66" width="54" height="54" rx="8" fill="#f2b134" />
        <rect x="132" width="54" height="54" rx="8" fill="#dbe4f2" />
        <rect x="198" width="54" height="54" rx="8" fill="#dbe4f2" />
        <text x="18" y="36" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          8
        </text>
        <text x="84" y="36" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          3
        </text>
        <text x="150" y="36" fill="#536176" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          1
        </text>
        <text x="216" y="36" fill="#536176" font-family="Arial, sans-serif" font-size="24" font-weight="800">
          6
        </text>
      </g>
      <text x="44" y="204" fill="#536176" font-family="Arial, sans-serif" font-size="18">
